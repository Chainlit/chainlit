name: E2E tests

on:
  workflow_call:
    inputs:
      e2e_parallel_shards:
        description: Number of parallel E2E shards per OS.
        type: number
        default: 5

permissions: read-all

jobs:
  prepare:
    name: Validate inputs and compute shard matrix
    runs-on: ubuntu-slim
    outputs:
      indexes: ${{ steps.shard-indexes.outputs.indexes }}
    steps:
      - name: Validate e2e_parallel_shards
        run: |
          n="${{ inputs.e2e_parallel_shards }}"
          if ! [[ "$n" =~ ^[0-9]+$ ]] || [[ "$n" -lt 1 ]]; then
            echo "❌ Error: e2e_parallel_shards must be at least 1, got: $n"
            exit 1
          fi
          echo "✅ Validation passed"
      - id: shard-indexes
        name: Compute shard indexes
        run: |
          json=$(jq -nc --argjson n "${{ inputs.e2e_parallel_shards }}" '[range(1; $n + 1)]')
          echo "indexes=$json" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        containers: ${{ fromJSON(needs.prepare.outputs.indexes) }}
    name: ${{ matrix.os }}-${{ matrix.containers }}
    env:
      BACKEND_DIR: ./backend
      # Single path for actions/cache on Linux + Windows (default Cypress dirs differ by OS).
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cypress-cache
    steps:
      - uses: actions/checkout@v6
      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: .cypress-cache
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.
      - name: Ensure Cypress binary is installed
        run: pnpm exec cypress install
        shell: bash
      - uses: ./.github/actions/uv-python-install
        name: Install Python, uv and Python & pnpm (uv does it automatically) dependencies
        with:
          working-directory: ${{ env.BACKEND_DIR }}
          uv-args: --extra tests
      - name: Run tests
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          SPLIT: ${{ inputs.e2e_parallel_shards }}
          SPLIT_INDEX1: ${{ matrix.containers }}
        run: pnpm test:e2e
        shell: bash
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('cypress/screenshots/**') != ''
        with:
          name: cypress-screenshots-${{ matrix.os }}-${{ matrix.containers }}
          path: cypress/screenshots
      - name: Upload retry report
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('cypress/reports/retries.json') != ''
        with:
          name: cypress-retries-${{ matrix.os }}-${{ matrix.containers }}
          path: cypress/reports/retries.json

  report-retries:
    name: Report flaky test retries
    needs: e2e-tests
    if: always()
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download retry reports
        uses: actions/download-artifact@v8
        with:
          pattern: cypress-retries-*
          path: retry-reports
        continue-on-error: true
      - name: Summarize retried tests
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const root = 'retry-reports';
            const retries = [];

            if (fs.existsSync(root)) {
              for (const shard of fs.readdirSync(root)) {
                const reportFile = path.join(root, shard, 'retries.json');
                if (!fs.existsSync(reportFile)) continue;
                const entries = JSON.parse(fs.readFileSync(reportFile, 'utf8'));
                for (const entry of entries) {
                  retries.push({ shard, ...entry });
                }
              }
            }

            if (retries.length === 0) {
              await core.summary
                .addHeading('Cypress retries', 3)
                .addRaw('No specs needed a retry in this run.')
                .write();
              return;
            }

            await core.summary
              .addHeading('Cypress retries', 3)
              .addTable([
                [
                  { data: 'Shard', header: true },
                  { data: 'Spec', header: true },
                  { data: 'Test', header: true },
                  { data: 'Attempts', header: true }
                ],
                ...retries.map((retry) => [
                  retry.shard,
                  retry.spec,
                  retry.title,
                  String(retry.attempts)
                ])
              ])
              .write();

            // Best-effort PR comment: on forked PRs GITHUB_TOKEN is read-only,
            // so a failure here must not fail the job. The step summary above
            // is the primary, always-available output.
            const pullRequest = context.payload.pull_request;
            const isFork =
              pullRequest &&
              pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            if (!pullRequest || isFork) return;

            const marker = '<!-- cypress-retry-report -->';
            const body = `${marker}\n**${retries.length} Cypress test attempt(s) were retried in this run.** See the job summary for details.`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number
              });
              const existingComment = comments.find((comment) =>
                comment.body?.includes(marker)
              );

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body
                });
              }
            } catch (error) {
              core.warning(`Could not post the retry-report comment: ${error.message}`);
            }
